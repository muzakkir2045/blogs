<html>

<head>
    <title>New Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='new_blog.css') }}">
</head>

<body>
    <main>
        <div class="container">
            <header>
                <h4>New Blog</h4>
            </header>
                <form class="new_blog" action="/new" method="POST">
                    <label for="blog_title">Blog title</label>
                    <input type="text" name="blog_title"><br>
                    <label for="blog_text">Blog title</label>
                    <textarea name="blog_text" rows="15" cols="80" placeholder="**bold**, *italic*, ## headings"
                        required></textarea><br>
                    <input type="submit" value="Publish">
                </form>
        </div>
    </main>
</body>

</html>
